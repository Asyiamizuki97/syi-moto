<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYI MOTO — Cinematic 3D Ride</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none;padding:clamp(20px,4vw,54px);display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,#03050a9c,transparent 25%,transparent 65%,#03050ad9)}
.brand{font-weight:900;letter-spacing:.3em;font-size:clamp(14px,2vw,22px)}.brand b{color:#f22c49}
.hero{max-width:600px}.eyebrow{font-size:11px;letter-spacing:.35em;color:#ff536c;font-weight:bold}.hero h1{font-size:clamp(38px,8vw,96px);line-height:.88;letter-spacing:-.06em;margin:12px 0}.hero h1 span{color:#f22c49}.hero p{color:#d3d7df;letter-spacing:.16em;font-size:clamp(9px,1.4vw,13px)}
.bottom{display:flex;align-items:end;justify-content:space-between;gap:15px}.tag{font-size:10px;letter-spacing:.25em;color:#c8ccd5}.controls{display:flex;gap:8px;pointer-events:auto}
button{border:1px solid #ffffff55;background:#10151dcc;color:white;padding:12px 17px;border-radius:30px;font-weight:bold;letter-spacing:.08em;cursor:pointer}button.primary{background:#ed2543;border-color:#ed2543}
#status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;color:#ffd4da;text-align:center;pointer-events:none}
@media(max-width:600px){.bottom{align-items:end}.tag{max-width:140px;line-height:1.6}.controls{flex-direction:column}button{padding:10px 13px}}
</style></head>
<body>
<div id="scene"></div>
<div class="hud">
  <div class="brand">SYI <b>MOTO</b></div>
  <div class="hero"><div class="eyebrow">CINEMATIC MOTORCYCLE FILM</div><h1>RIDE<br><span>BEYOND.</span></h1><p>POWER · STYLE · FREEDOM</p></div>
  <div class="bottom"><div class="tag">CONCEPT FILM / 08 SECONDS</div><div class="controls"><button id="restart">↻ REPLAY</button><button class="primary" id="sound">♫ SOUND ON</button></div></div>
</div>
<div id="status">Memuatkan dunia 3D…</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.querySelector('#scene'),status=document.querySelector('#status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090d17);scene.fog=new THREE.FogExp2(0x101522,.025);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,250);camera.position.set(5,4,9);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9eb8ff,0x171018,2.1));
const key=new THREE.DirectionalLight(0xffd0b0,3.5);key.position.set(-4,8,5);key.castShadow=true;scene.add(key);
const rim=new THREE.PointLight(0xff234d,65,24);rim.position.set(3,3,-5);scene.add(rim);
const roadMat=new THREE.MeshStandardMaterial({color:0x161a22,roughness:.9});
const road=new THREE.Mesh(new THREE.PlaneGeometry(16,240),roadMat);road.rotation.x=-Math.PI/2;road.position.z=-65;road.receiveShadow=true;scene.add(road);
const laneMat=new THREE.MeshBasicMaterial({color:0x9298a6});
const laneMarks=[];for(let z=18;z>-180;z-=10){const mark=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,4),laneMat);mark.position.set(0,.018,z);scene.add(mark);laneMarks.push(mark);}
const roadside=[];
for(const side of [-1,1])for(let z=12;z>-180;z-=14){const post=new THREE.Group();post.position.set(side*5.0,0,z);box(post,.12,1.15,.12,silver,0,.58,0);box(post,.42,.08,.12,red,0,1.12,0);scene.add(post);roadside.push(post);}
for(const x of [-5.2,5.2]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.13,.65,240),new THREE.MeshStandardMaterial({color:0x303746,metalness:.6,roughness:.35}));rail.position.set(x,.3,-65);scene.add(rail);}
const bike=new THREE.Group();scene.add(bike);
const black=new THREE.MeshStandardMaterial({color:0x080b11,metalness:.72,roughness:.25});
const red=new THREE.MeshStandardMaterial({color:0xe51d3e,metalness:.55,roughness:.24});
const silver=new THREE.MeshStandardMaterial({color:0x9da7b6,metalness:.85,roughness:.2});
const rubber=new THREE.MeshStandardMaterial({color:0x050608,roughness:.94});
function box(parent,w,h,d,mat,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;parent.add(m);return m}
function cyl(parent,r1,r2,len,mat,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,20),mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;parent.add(m);return m}
const wheels=[];
for(const z of [-1.15,1.18]){const w=new THREE.Group();w.position.set(0,.62,z);bike.add(w);const tire=new THREE.Mesh(new THREE.TorusGeometry(.57,.13,14,36),rubber);tire.rotation.y=Math.PI/2;tire.castShadow=true;w.add(tire);const hub=cyl(w,.19,.19,.22,silver,0,0,0,Math.PI/2);for(let i=0;i<8;i++){const a=i*Math.PI/4;box(w,.045,.78,.035,silver,0,Math.sin(a)*.34,Math.cos(a)*.34,a);}wheels.push(w);}
box(bike,.52,.36,1.45,black,0,1.02,0,0);
const tank=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),red);tank.scale.set(.42,.35,.72);tank.position.set(0,1.38,-.05);tank.castShadow=true;bike.add(tank);
const nose=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),black);nose.scale.set(.38,.47,.35);nose.position.set(0,1.32,-1.03);bike.add(nose);
box(bike,.42,.12,.7,black,0,.94,.78);
for(const side of [-1,1]){cyl(bike,.06,.06,.95,silver,side*.27,1.02,-.98,.18);box(bike,.08,.08,.72,red,side*.25,1.25,-.45,0,0,.16);}
cyl(bike,.22,.22,.7,silver,.38,.88,.25,Math.PI/2);cyl(bike,.16,.16,.6,black,.4,.88,.25,Math.PI/2);
box(bike,.62,.06,.08,silver,0,1.77,-1.12,0,0,-.12);
const headlight=new THREE.PointLight(0xddeaff,28,16);headlight.position.set(0,1.35,-1.5);bike.add(headlight);
const rider=new THREE.Group();bike.add(rider);
const suit=new THREE.MeshStandardMaterial({color:0x111722,roughness:.7});
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.65,5,10),suit);torso.position.set(0,2.03,.02);torso.rotation.x=-.45;rider.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.25,20,16),new THREE.MeshStandardMaterial({color:0x9a674f,roughness:.8}));head.position.set(0,2.53,-.35);rider.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.27,18,14),new THREE.MeshStandardMaterial({color:0x08090d,roughness:.35}));hair.scale.set(1.05,1.2,1.25);hair.position.set(0,2.61,-.3);rider.add(hair);
for(const s of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.62,4,8),suit);arm.position.set(s*.39,1.93,-.48);arm.rotation.z=s*.55;arm.rotation.x=-.7;rider.add(arm);const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.72,4,8),suit);leg.position.set(s*.28,1.25,.52);leg.rotation.x=1.05;leg.rotation.z=s*.2;rider.add(leg);}
const photo=new THREE.TextureLoader();photo.load('assets/image.png',tex=>{tex.colorSpace=THREE.SRGBColorSpace;const face=new THREE.Mesh(new THREE.PlaneGeometry(.38,.42),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));face.position.set(0,2.52,-.115);face.rotation.y=Math.PI;face.scale.set(.7,.7,1);rider.add(face);status.textContent='Visual reference dimuatkan · gunakan replay untuk ulang';},undefined,()=>{status.textContent='3D rider aktif · tambah assets/image.png untuk visual reference';});
const streaks=new THREE.Group();scene.add(streaks);
for(let i=0;i<75;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.025,.025,THREE.MathUtils.randFloat(2,8)),new THREE.MeshBasicMaterial({color:i%3?0x9cb7e8:0xff3657,transparent:true,opacity:.5}));m.position.set(THREE.MathUtils.randFloatSpread(18),THREE.MathUtils.randFloat(.2,6),THREE.MathUtils.randFloat(-130,15));streaks.add(m);}
let start=performance.now(),soundOn=false,audioCtx=null,osc=null;
function reset(){start=performance.now();}document.querySelector('#restart').onclick=reset;
document.querySelector('#sound').onclick=()=>{soundOn=!soundOn;document.querySelector('#sound').textContent=soundOn?'♫ SOUND OFF':'♫ SOUND ON';if(soundOn){audioCtx??=new AudioContext();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.value=58;g.gain.value=.025;o.connect(g);g.connect(audioCtx.destination);o.start();osc=o;osc.gainNode=g;}else if(osc){osc.stop();osc=null;}};
function animate(now){requestAnimationFrame(animate);const elapsed=(now-start)/1000;const t=(elapsed%8)/8;const phase=elapsed*Math.PI*2;
bike.position.set(Math.sin(phase*.42)*.48,Math.sin(phase*2.8)*.045,0);
bike.rotation.z=Math.sin(phase*.72)*.095;
bike.rotation.y=Math.sin(phase*.55)*.12;
wheels.forEach(w=>w.rotation.x-=.34);
rider.rotation.z=Math.sin(phase*.72)*.035;
laneMarks.forEach(m=>{m.position.z+=1.15;if(m.position.z>22)m.position.z=-178;});
roadside.forEach(p=>{p.position.z+=1.15;if(p.position.z>18)p.position.z=-178;});
streaks.children.forEach(m=>{m.position.z+=1.45;if(m.position.z>15)m.position.z=-130;});
const angle=elapsed*.42;
const camX=Math.sin(angle)*6.2;
const camZ=Math.cos(angle)*7.2;
const camY=2.8+Math.sin(elapsed*.7)*.55;
camera.position.lerp(new THREE.Vector3(camX,camY,camZ),.045);
camera.lookAt(bike.position.x,1.45,0);
renderer.render(scene,camera);
}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
status.textContent='3D cinematic ready · tekan Replay';
</script></body></html>
